<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compara mazos de Riftbound en formato Tourney para identificar qué cartas priorizar.">
  <title>Riftbound Deck Comparator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>Riftbound Deck Comparator</h1>
      <p>Ingresa mazos en formato Tourney de riftbound.gg para saber qué cartas priorizar.</p>
    </header>

    <section class="input-section">
      <div id="deck-inputs"></div>

      <div class="input-actions">
        <button id="btn-add-deck" class="btn btn-secondary">+ Agregar mazo</button>
        <button id="btn-compare" class="btn btn-primary">Comparar mazos</button>
      </div>
    </section>

    <div id="legend-error-banner" class="error-banner hidden"></div>
    <p id="analysis-summary" class="summary-bar hidden"></p>

    <section id="results" class="hidden">
      <div class="results-header">
        <h2>Ranking de cartas</h2>
        <button id="btn-export" class="btn btn-secondary btn-sm">Exportar como texto</button>
      </div>

      <div class="table-wrapper">
        <table class="results-table">
          <thead>
            <tr>
              <th>Carta</th>
              <th>Categoría</th>
              <th>% mazos</th>
              <th>Copias prom.</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="card-table-body"></tbody>
        </table>
      </div>

      <h2 class="section-title">Battlefields</h2>
      <div class="table-wrapper">
        <table class="results-table">
          <thead>
            <tr>
              <th>Battlefield</th>
              <th>Categoría</th>
              <th>% mazos</th>
            </tr>
          </thead>
          <tbody id="bf-table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="modal-close-btn" aria-label="Cerrar">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="js/parser.js"></script>
  <script src="js/validator.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/render.js"></script>
  <script src="js/export.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
